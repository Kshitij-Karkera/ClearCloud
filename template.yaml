AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClearCloud - multi-tenant, serverless multi-cloud cost-waste scanner

Parameters:
  LabRoleArn:
    Type: String
    Description: >
      ARN of an existing IAM role the functions run as. Student sandboxes cannot create
      IAM roles, so pass a role that already exists and that Lambda can assume.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret that signs sign-in tokens. deploy_backend.sh generates one for you.
  AdminEmails:
    Type: String
    Default: ''
    Description: Comma-separated emails that get admin rights (may scan the account that hosts ClearCloud)
  AwsAccessKeyId:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Temporary access key the code uses instead of the execution role (sandbox only)
  AwsSecretAccessKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Matches AwsAccessKeyId
  AwsSessionToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Matches AwsAccessKeyId

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: kind
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: kind-index
          KeySchema:
            - AttributeName: kind
              KeyType: HASH
            - AttributeName: pk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ScanTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: ClearCloud scan requests

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: clearcloud-api
      CodeUri: src/api/
      Handler: app.lambda_handler
      Role: !Ref LabRoleArn
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          TOPIC_ARN: !Ref ScanTopic
          JWT_SECRET: !Ref JwtSecret
          ADMIN_EMAILS: !Ref AdminEmails
          CC_ACCESS_KEY_ID: !Ref AwsAccessKeyId
          CC_SECRET_ACCESS_KEY: !Ref AwsSecretAccessKey
          CC_SESSION_TOKEN: !Ref AwsSessionToken

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: clearcloud-dispatcher
      CodeUri: src/dispatcher/
      Handler: app.lambda_handler
      Role: !Ref LabRoleArn
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          TOPIC_ARN: !Ref ScanTopic
          CC_ACCESS_KEY_ID: !Ref AwsAccessKeyId
          CC_SECRET_ACCESS_KEY: !Ref AwsSecretAccessKey
          CC_SESSION_TOKEN: !Ref AwsSessionToken
      Events:
        DailyScan:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  ScannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: clearcloud-scanner
      CodeUri: src/scanner/
      Handler: app.lambda_handler
      Role: !Ref LabRoleArn
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          DEFAULT_AWS_REGION: !Ref AWS::Region
          CC_ACCESS_KEY_ID: !Ref AwsAccessKeyId
          CC_SECRET_ACCESS_KEY: !Ref AwsSecretAccessKey
          CC_SESSION_TOKEN: !Ref AwsSessionToken
      Events:
        ScanRequests:
          Type: SNS
          Properties:
            Topic: !Ref ScanTopic

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: site
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteUrl:
    Description: Open this URL to use ClearCloud
    Value: !Sub https://${Distribution.DomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  Region:
    Value: !Ref AWS::Region
  ScanTopicArn:
    Value: !Ref ScanTopic
  ApiFunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  DispatcherFunctionName:
    Value: !Ref DispatcherFunction
