AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClearCloud - multi-tenant, serverless multi-cloud cost-waste scanner

Parameters:
  LabRoleArn:
    Type: String
    Default: ''
    Description: >
      Optional. ARN of an existing IAM role the functions run as (student sandboxes cannot create
      IAM roles). Leave empty in a normal AWS account and the stack creates its own least-privilege role.
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret that signs sign-in tokens. deploy_backend.sh generates one for you.
  AdminEmails:
    Type: String
    Default: ''
    Description: Comma-separated emails that get admin rights (may scan the account that hosts ClearCloud)
  AwsAccessKeyId:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Temporary access key the code uses instead of the execution role (sandbox only)
  AwsSecretAccessKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Matches AwsAccessKeyId
  AwsSessionToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Matches AwsAccessKeyId
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional. Email address that receives new-waste alerts and alarm notifications (AWS sends a confirmation link first)
  EnableAlarms:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create CloudWatch alarms. Off by default because some student sandboxes deny alarm creation

Conditions:
  CreateRole: !Equals [!Ref LabRoleArn, '']
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  AlarmsOn: !Equals [!Ref EnableAlarms, 'true']

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: kind
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: kind-index
          KeySchema:
            - AttributeName: kind
              KeyType: HASH
            - AttributeName: pk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  LambdaRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: clearcloud-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Table
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub ${Table.Arn}/index/*
              - Sid: Topics
                Effect: Allow
                Action: sns:Publish
                Resource:
                  - !Ref ScanTopic
                  - !Ref AlertTopic
              - Sid: CloudSecrets
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clearcloud/*
              - Sid: ReadOnlyScan
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - cloudwatch:GetMetricStatistics
                  - ce:GetCostAndUsage
                  - sts:AssumeRole
                Resource: '*'

  ScanTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: ClearCloud scan requests

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: ClearCloud alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: clearcloud-api
      CodeUri: src/api/
      Handler: app.lambda_handler
      Role: !If [CreateRole, !GetAtt LambdaRole.Arn, !Ref LabRoleArn]
      FunctionUrlConfig:
        AuthType: NONE
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          TOPIC_ARN: !Ref ScanTopic
          JWT_SECRET: !Ref JwtSecret
          ADMIN_EMAILS: !Ref AdminEmails
          CC_ACCESS_KEY_ID: !Ref AwsAccessKeyId
          CC_SECRET_ACCESS_KEY: !Ref AwsSecretAccessKey
          CC_SESSION_TOKEN: !Ref AwsSessionToken

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: clearcloud-dispatcher
      CodeUri: src/dispatcher/
      Handler: app.lambda_handler
      Role: !If [CreateRole, !GetAtt LambdaRole.Arn, !Ref LabRoleArn]
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          TOPIC_ARN: !Ref ScanTopic
          CC_ACCESS_KEY_ID: !Ref AwsAccessKeyId
          CC_SECRET_ACCESS_KEY: !Ref AwsSecretAccessKey
          CC_SESSION_TOKEN: !Ref AwsSessionToken
      Events:
        DailyScan:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  ScannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: clearcloud-scanner
      CodeUri: src/scanner/
      Handler: app.lambda_handler
      Role: !If [CreateRole, !GetAtt LambdaRole.Arn, !Ref LabRoleArn]
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          DEFAULT_AWS_REGION: !Ref AWS::Region
          ALERT_TOPIC_ARN: !Ref AlertTopic
          CC_ACCESS_KEY_ID: !Ref AwsAccessKeyId
          CC_SECRET_ACCESS_KEY: !Ref AwsSecretAccessKey
          CC_SESSION_TOKEN: !Ref AwsSessionToken
      Events:
        ScanRequests:
          Type: SNS
          Properties:
            Topic: !Ref ScanTopic

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsOn
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-errors
      AlarmDescription: Api Lambda reported at least one error in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  DispatcherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsOn
    Properties:
      AlarmName: !Sub ${AWS::StackName}-dispatcher-errors
      AlarmDescription: Dispatcher Lambda reported at least one error in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DispatcherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ScannerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsOn
    Properties:
      AlarmName: !Sub ${AWS::StackName}-scanner-errors
      AlarmDescription: Scanner Lambda reported at least one error in 5 minutes
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScannerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  ScannerSlowAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsOn
    Properties:
      AlarmName: !Sub ${AWS::StackName}-scanner-near-timeout
      AlarmDescription: A scan ran longer than 240 s (the timeout is 300 s)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScannerFunction
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 240000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-monitoring
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Invocations", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
               "metrics": [
                 ["AWS/Lambda", "Invocations", "FunctionName", "${ApiFunction}"],
                 ["AWS/Lambda", "Invocations", "FunctionName", "${DispatcherFunction}"],
                 ["AWS/Lambda", "Invocations", "FunctionName", "${ScannerFunction}"]]}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
             "properties": {"title": "Errors", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
               "metrics": [
                 ["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}"],
                 ["AWS/Lambda", "Errors", "FunctionName", "${DispatcherFunction}"],
                 ["AWS/Lambda", "Errors", "FunctionName", "${ScannerFunction}"]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "Scanner duration (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
               "metrics": [
                 ["AWS/Lambda", "Duration", "FunctionName", "${ScannerFunction}", {"stat": "Average"}],
                 ["AWS/Lambda", "Duration", "FunctionName", "${ScannerFunction}", {"stat": "Maximum"}]]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
             "properties": {"title": "Concurrent scanner executions", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 60,
               "metrics": [
                 ["AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${ScannerFunction}"]]}}
          ]
        }

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: site
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  SiteUrl:
    Description: Open this URL to use ClearCloud
    Value: !Sub https://${Distribution.DomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref Distribution
  Region:
    Value: !Ref AWS::Region
  ScanTopicArn:
    Value: !Ref ScanTopic
  ApiFunctionUrl:
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  DispatcherFunctionName:
    Value: !Ref DispatcherFunction
  AlertTopicArn:
    Value: !Ref AlertTopic
  DashboardName:
    Value: !Sub ${AWS::StackName}-monitoring
    