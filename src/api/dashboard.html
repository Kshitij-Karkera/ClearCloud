<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearCloud</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #fff;
      --ink: #1b2a41;
      --muted: #5b6b82;
      --accent: #1f3864;
      --good: #1a7f4b;
      --line: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      background: var(--accent);
      color: #fff;
      padding: 18px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header p {
      margin: 4px 0 0;
      font-size: 13px;
      opacity: .8;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .tile,
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
    }

    .tile .label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .tile .value {
      font-size: 28px;
      font-weight: 700;
      margin-top: 6px;
    }

    .tile .value.good {
      color: var(--good);
    }

    h2 {
      font-size: 16px;
      margin: 24px 0 10px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 200px 1fr 70px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      margin: 6px 0;
    }

    .bar {
      height: 10px;
      background: #dbe4f0;
      border-radius: 5px;
      overflow: hidden;
    }

    .bar>span {
      display: block;
      height: 100%;
      background: var(--accent);
    }

    .finding {
      border-top: 1px solid var(--line);
      padding: 12px 0;
    }

    .finding:first-child {
      border-top: 0;
    }

    .finding .top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 600;
    }

    .finding .save {
      color: var(--good);
      white-space: nowrap;
    }

    .finding .meta {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 6px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      padding: 1px 7px;
      border-radius: 999px;
      color: #fff;
      margin-right: 6px;
    }

    .badge.aws {
      background: #c46a00;
    }

    .badge.azure {
      background: #0067b8;
    }

    .badge.gcp {
      background: #1a7f4b;
    }

    .finding .rec {
      font-size: 14px;
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      background: #fff8e6;
      border: 1px solid #f1dfa7;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      padding: 8px 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>ClearCloud</h1>
    <p id="sub">Loading latest scan&hellip;</p>
  </header>
  <main>
    <div id="notes"></div>
    <div class="tiles">
      <div class="tile">
        <div class="label">Potential monthly savings</div>
        <div class="value good" id="t-save">&ndash;</div>
      </div>
      <div class="tile">
        <div class="label">Issues found</div>
        <div class="value" id="t-count">&ndash;</div>
      </div>
      <div class="tile">
        <div class="label">Clouds scanned</div>
        <div class="value" id="t-clouds">&ndash;</div>
      </div>
      <div class="tile">
        <div class="label">AWS 30-day spend</div>
        <div class="value" id="t-spend">&ndash;</div>
      </div>
    </div>

    <h2>AWS spend by service (last 30 days)</h2>
    <div class="card" id="spend"></div>

    <h2>Recommendations</h2>
    <div class="card" id="findings"></div>
  </main>
  <script>
    const money = n => "$" + Number(n).toFixed(2);
    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    };

    fetch("api/report")
      .then(r => r.ok ? r.json() : r.json().then(j => Promise.reject(j.error || "Request failed")))
      .then(render)
      .catch(err => { document.getElementById("sub").textContent = String(err); });

    function render(d) {
      document.getElementById("sub").textContent =
        "Last scan: " + new Date(d.scanned_at).toLocaleString() + " · Providers: " + d.providers.join(", ");
      document.getElementById("t-clouds").textContent = d.providers.length;
      document.getElementById("t-save").textContent = money(d.summary.total_est_monthly_savings);
      document.getElementById("t-count").textContent = d.summary.count;

      const notes = document.getElementById("notes");
      if (d.demo_note) notes.appendChild(el("div", "note", d.demo_note));
      if (d.cost_explorer_status !== "ok" && d.cost_explorer_status !== "not requested") {
        notes.appendChild(el("div", "note",
          "Spend data is unavailable (Cost Explorer: " + d.cost_explorer_status +
          "). Resource findings below are still live. Savings are estimates based on typical on-demand prices."));
      }
      (d.errors || []).forEach(e => notes.appendChild(el("div", "note", "Scan warning: " + e)));

      const spendBox = document.getElementById("spend");
      if (!d.spend.length) {
        spendBox.appendChild(el("div", "empty", "No spend data available."));
        document.getElementById("t-spend").textContent = "n/a";
      } else {
        const max = Math.max(...d.spend.map(s => s.cost));
        document.getElementById("t-spend").textContent = money(d.spend.reduce((a, s) => a + s.cost, 0));
        d.spend.slice(0, 10).forEach(s => {
          const row = el("div", "bar-row");
          row.appendChild(el("div", "", s.service));
          const bar = el("div", "bar"); const fill = el("span"); fill.style.width = (s.cost / max * 100) + "%";
          bar.appendChild(fill); row.appendChild(bar);
          row.appendChild(el("div", "", money(s.cost)));
          spendBox.appendChild(row);
        });
      }

      const box = document.getElementById("findings");
      if (!d.findings.length) {
        box.appendChild(el("div", "empty", "No wasted resources detected. Nice."));
        return;
      }
      d.findings.forEach(f => {
        const wrap = el("div", "finding");
        const top = el("div", "top");
        top.appendChild(el("span", "", f.title));
        top.appendChild(el("span", "save", "save ~" + money(f.est_monthly_savings) + "/mo"));
        wrap.appendChild(top);
        const meta = el("div", "meta");
        meta.appendChild(el("span", "badge " + f.provider, f.provider.toUpperCase()));
        meta.appendChild(document.createTextNode(f.resource_id + " · " + f.region));
        wrap.appendChild(meta);
        wrap.appendChild(el("div", "rec", f.recommendation));
        box.appendChild(wrap);
      });
    }
  </script>
</body>

</html>
